<svg xmlns='http://www.w3.org/2000/svg' width='820' height='588' viewBox='0 0 820 588' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif'><rect width='820' height='588' rx='14' fill='#f6f8fa'/><text x='24' y='42' font-size='18' font-weight='700' fill='#24292f'>Blank tabs never pile up</text><circle cx='36' cy='78' r='12' fill='#24292f'/><text x='36' y='82.5' font-size='13' font-weight='700' fill='#fff' text-anchor='middle'>1</text><text x='58' y='83' font-size='15' font-weight='600' fill='#24292f'>You open another tab with Ctrl+T.<tspan font-weight='400' fill='#57606a'>  Now there are two blank tabs.</tspan></text><rect x='24' y='134' width='772' height='86' rx='10' fill='#1f2023'/><circle cx='42' cy='156' r='5' fill='#ff5f57'/><circle cx='58' cy='156' r='5' fill='#febc2e'/><circle cx='74' cy='156' r='5' fill='#28c840'/><path d='M98 178 v-24 q0 -8 8 -8 h134 q8 0 8 8 v24 z' fill='#2b2d31'/><circle cx='116' cy='162' r='5' fill='#9aa0a6' opacity='.7'/><text x='130' y='167' font-size='13' fill='#9aa0a6'>Docs</text><path d='M252 178 v-24 q0 -8 8 -8 h134 q8 0 8 8 v24 z' fill='#2b2d31'/><rect x='253.5' y='147.5' width='147' height='29' rx='7' fill='none' stroke='#ff6a3d' stroke-width='2' stroke-dasharray='5 4'/><text x='266' y='167' font-size='15' fill='#ff6a3d'>+</text><text x='282' y='167' font-size='13' fill='#9aa0a6'>New Tab</text><path d='M406 178 v-24 q0 -8 8 -8 h134 q8 0 8 8 v24 z' fill='#3a3c41'/><circle cx='424' cy='162' r='5' fill='#e8eaed' opacity='.7'/><text x='438' y='167' font-size='13' fill='#e8eaed'>New Tab</text><rect x='24' y='178' width='772' height='42' fill='#3a3c41'/><rect x='36' y='185' width='748' height='28' rx='14' fill='#1f2023'/><text x='54' y='204' font-size='13' fill='#9aa0a6'>Search or type a URL</text><rect x='448.8' y='108' width='64.4' height='22' rx='11' fill='#24292f'/><text x='481.0' y='123' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>Ctrl+T</text><circle cx='36' cy='250' r='12' fill='#24292f'/><text x='36' y='254.5' font-size='13' font-weight='700' fill='#fff' text-anchor='middle'>2</text><text x='58' y='255' font-size='15' font-weight='600' fill='#24292f'>You search in it.<tspan font-weight='400' fill='#57606a'>  The existing blank tab is moved to the end instead of opening a new one.</tspan></text><rect x='24' y='306' width='772' height='86' rx='10' fill='#1f2023'/><circle cx='42' cy='328' r='5' fill='#ff5f57'/><circle cx='58' cy='328' r='5' fill='#febc2e'/><circle cx='74' cy='328' r='5' fill='#28c840'/><path d='M98 350 v-24 q0 -8 8 -8 h134 q8 0 8 8 v24 z' fill='#2b2d31'/><circle cx='116' cy='334' r='5' fill='#9aa0a6' opacity='.7'/><text x='130' y='339' font-size='13' fill='#9aa0a6'>Docs</text><path d='M252 350 v-24 q0 -8 8 -8 h134 q8 0 8 8 v24 z' fill='#3a3c41'/><circle cx='270' cy='334' r='5' fill='#e8eaed' opacity='.7'/><text x='284' y='339' font-size='13' fill='#e8eaed'>pasta recipe</text><path d='M406 350 v-24 q0 -8 8 -8 h134 q8 0 8 8 v24 z' fill='#2b2d31'/><rect x='407.5' y='319.5' width='147' height='29' rx='7' fill='none' stroke='#ff6a3d' stroke-width='2' stroke-dasharray='5 4'/><text x='420' y='339' font-size='15' fill='#ff6a3d'>+</text><text x='436' y='339' font-size='13' fill='#9aa0a6'>New Tab</text><rect x='24' y='350' width='772' height='42' fill='#3a3c41'/><rect x='36' y='357' width='748' height='28' rx='14' fill='#1f2023'/><text x='54' y='376' font-size='13' fill='#e8eaed'>search.example/?q=pasta+recipe</text><rect x='452.5' y='280' width='57.0' height='22' rx='11' fill='#ff6a3d'/><text x='481.0' y='295' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>moved</text><circle cx='36' cy='422' r='12' fill='#24292f'/><text x='36' y='426.5' font-size='13' font-weight='700' fill='#fff' text-anchor='middle'>3</text><text x='58' y='427' font-size='15' font-weight='600' fill='#24292f'>Links you open land to the left of it.<tspan font-weight='400' fill='#57606a'>  The blank tab stays last.</tspan></text><rect x='24' y='478' width='77